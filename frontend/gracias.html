<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido registrado</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background:#f3f4f6; margin:0; padding:40px 16px; text-align:center; }
  .card { max-width:420px; margin:0 auto; background:#fff; border-radius:12px; padding:32px 24px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size:20px; }
  .id { font-family: monospace; background:#f3f4f6; padding:6px 10px; border-radius:6px; display:inline-block; margin:10px 0; }
  a.btn { display:inline-block; margin-top:20px; background:#1d4ed8; color:#fff; text-decoration:none; padding:12px 20px; border-radius:8px; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <h1 id="titulo">✅ ¡Pedido registrado!</h1>
  <p id="texto">Guardá este número, te va a servir para retirar tu pedido.</p>
  <div class="id" id="idPedido"></div>
  <p id="detalle"></p>
  <a class="btn" href="index.html">Hacer otro pedido</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const efectivo = params.get("efectivo");
  document.getElementById("idPedido").textContent = id || "-";
  if (efectivo) {
    document.getElementById("detalle").textContent =
      "Pasá por el local para pagar en efectivo. Apenas confirmemos el pago, tu pedido se manda a imprimir.";
  } else {
    document.getElementById("detalle").textContent =
      "Tu pago está siendo procesado. Apenas se acredite, tu pedido se manda a imprimir automáticamente.";
  }
</script>
</body>
</html>
